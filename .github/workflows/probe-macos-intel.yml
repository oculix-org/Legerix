name: Intel Mac build check
run-name: Intel Mac build check · ${{ github.ref_name }}

# The build_macos_x64 job of build.yml, copied verbatim, with one change:
# runs-on macos-15-intel instead of macos-latest. build.yml's comment
# ("Verified Intel-compatible by upstream Apertix") dates from when
# macos-latest still meant macos-12 (Intel); since macos-14 became latest
# the job has been compiling arm64 while believing it builds Intel — the
# darwin tier of 5.5.0-8 carries arm64 dylibs (Mach-O cputype 0x0100000C).
#
# This workflow builds ONLY the Intel tier, uploads it as a run artifact,
# prints the architecture of every dylib in the log, and touches no release.
# Run it by hand, read the log, download the artifact. If it is green and
# x86_64, the fix for build.yml is the single runs-on line.

on:
  workflow_dispatch:

jobs:
  probe_macos_x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Runner architecture (sanity)
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          # The darwin tiers link Homebrew's codecs by absolute path and ship
          # none of them: Homebrew is the documented prerequisite (README).
          brew install autoconf automake libtool pkg-config \
                       libpng jpeg libtiff \
                       webp xz zstd jbigkit libdeflate

      - name: Build leptonica + tesseract
        run: |
          PREFIX="$RUNNER_TEMP/legerix-prefix"
          mkdir -p "$PREFIX"
          ./scripts/build-leptonica.sh "$LEPTONICA_VERSION" "$PREFIX"
          ./scripts/build-tesseract.sh "$TESSERACT_VERSION" "$PREFIX"
          mkdir -p out
          cp -L "$PREFIX/lib/libleptonica.6.dylib" out/
          cp -L "$PREFIX/lib/libtesseract.5.dylib" out/

      - name: Rewrite install names + codesign (relocatable dylibs)
        run: |
          # Fresh-built dylibs record the runner's prefix as their install name
          # and as libtesseract's reference to libleptonica; @loader_path makes
          # both relative to the extraction directory. codesign is mandatory
          # after install_name_tool on arm64.
          install_name_tool -id "@loader_path/libleptonica.6.dylib" out/libleptonica.6.dylib
          install_name_tool -id "@loader_path/libtesseract.5.dylib" out/libtesseract.5.dylib
          install_name_tool -change "$RUNNER_TEMP/legerix-prefix/lib/libleptonica.6.dylib" \
                                    "@loader_path/libleptonica.6.dylib" \
                                    out/libtesseract.5.dylib
          codesign -f -s - out/libleptonica.6.dylib
          codesign -f -s - out/libtesseract.5.dylib

      - name: Architecture of every produced dylib (the whole point of this probe)
        run: |
          echo "=== lipo -archs ==="
          for f in out/*.dylib; do
            printf '%-32s ' "$(basename "$f")"; lipo -archs "$f"
          done
          echo "=== file ==="
          file out/*.dylib
          echo "=== gate: libtesseract + libleptonica must be x86_64 ==="
          for f in out/libtesseract.5.dylib out/libleptonica.6.dylib; do
            lipo -archs "$f" | grep -qw x86_64 || { echo "NOT x86_64: $f"; exit 1; }
          done
          echo "OK: Intel tier is x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-intel-probe
          path: out/
