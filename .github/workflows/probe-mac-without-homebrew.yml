name: Mac without Homebrew
run-name: Mac without Homebrew · ${{ github.ref_name }}

# What a user with a bare Mac actually sees when the codecs are missing.
#
# The job in verify-octachorix-interference.yml removes the seven formulae with
# `brew uninstall` and leaves Homebrew itself in place. David Young's objection
# in #22 is that this proves the message maps four literal strings correctly,
# not that those are the strings dyld emits on a machine that never had brew.
# So here Homebrew is removed with its own uninstaller, and the job refuses to
# go further until it has checked that nothing is left behind.
#
# It touches no source file. The probe is written inline below rather than
# taken from scripts/, so this workflow runs on the tree as it stands.
#
# Diagnostic, not a gate: workflow_dispatch only. It reads its natives from a
# published release, so it builds nothing and needs no brew of its own.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to take the darwin natives from (blank = the pom version)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: macOS Intel, Homebrew fully uninstalled
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Never typed in: a hardcoded tag here would keep testing an old payload
      # while the code moves on.
      - name: Resolve the release tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "natives taken from $TAG"

      - name: Stage the darwin Intel natives from the release
        run: |
          D=src/main/resources/META-INF/legerix/natives/darwin
          mkdir -p "$D"
          BASE=https://github.com/oculix-org/Legerix/releases/download/${RELEASE_TAG}
          curl -fsSL -o "$D/libtesseract.5.dylib" "$BASE/libtesseract.5-darwin.dylib"
          curl -fsSL -o "$D/libleptonica.6.dylib" "$BASE/libleptonica.6-darwin.dylib"
          # Unversioned symlinks, load-bearing per 00bad35
          ln -sf libtesseract.5.dylib "$D/libtesseract.dylib"
          ln -sf libleptonica.6.dylib "$D/libleptonica.dylib"
          ls -la "$D"

      - name: Placeholders for the other tiers, manifest, traineddata
        run: |
          N=src/main/resources/META-INF/legerix/natives
          # Git tracks no empty directory, and unlike the job this step was
          # copied from, nothing here has downloaded an artifact that creates
          # the tree. So the tiers have to be made before they can be filled.
          mkdir -p $N/linux-x86-64 $N/linux-aarch64 $N/darwin-aarch64 $N/win32-x86-64
          : > $N/linux-x86-64/libtesseract.so.5
          : > $N/linux-aarch64/libtesseract.so.5
          : > $N/darwin-aarch64/libtesseract.5.dylib
          : > $N/win32-x86-64/tesseract55.dll
          LEGERIX_TIERS=darwin bash ./scripts/write-natives-manifest.sh "$N"
          bash ./scripts/fetch-traineddata.sh src/main/resources/META-INF/legerix/tessdata

      # Packaged while brew is still around, so nothing in the build can be
      # blamed for the uninstall.
      # After the uninstall the probe runs the way David Young would run it on
      # his own bare Mac: a JVM and two jars, nothing else. So JNA is fetched
      # straight from Central rather than resolved through Maven, whose mvn on
      # these runners comes from Homebrew and leaves with it.
      - name: Package and fetch JNA
        run: |
          mvn -B -q package -DskipTests
          JNA_VERSION=$(grep -A2 '<artifactId>jna</artifactId>' pom.xml \
                        | grep -m1 '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          [ -n "$JNA_VERSION" ] || { echo "::error::JNA version not found in pom.xml"; exit 1; }
          curl -fsSL -o /tmp/jna.jar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/${JNA_VERSION}/jna-${JNA_VERSION}.jar"
          ls -l /tmp/jna.jar
          echo "LEGERIX_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> $GITHUB_ENV

      - name: What the natives link against, before anything is removed
        run: |
          otool -L src/main/resources/META-INF/legerix/natives/darwin/libleptonica.6.dylib
          echo "--- formulae present ---"
          brew list --formula 2>/dev/null | tr '\n' ' ' || echo "(brew already absent)"

      - name: Uninstall Homebrew with its own uninstaller
        run: |
          NONINTERACTIVE=1 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" -- --force
          echo "uninstaller finished with $?"

      # The precondition is the whole point. If a codec survives, the load may
      # succeed and the probe would report a green that means nothing.
      - name: Check the machine really has no Homebrew and no codecs
        run: |
          FAIL=0
          if command -v brew >/dev/null 2>&1; then
            echo "::error::brew is still on PATH at $(command -v brew)"; FAIL=1
          fi
          for d in /usr/local/opt /usr/local/Cellar /usr/local/Homebrew /opt/homebrew; do
            [ -e "$d" ] && { echo "::error::$d still exists"; ls "$d" | head; FAIL=1; }
          done
          LEFT=$(ls /usr/local/lib/libjpeg*.dylib /usr/local/lib/libpng*.dylib \
                    /usr/local/lib/libtiff*.dylib /usr/local/lib/libwebp*.dylib \
                    /usr/local/lib/liblzma*.dylib /usr/local/lib/libzstd*.dylib \
                    /usr/local/lib/libdeflate*.dylib 2>/dev/null || true)
          if [ -n "$LEFT" ]; then
            echo "::error::codecs still reachable, the probe would prove nothing:"
            echo "$LEFT"; FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || exit 1
          echo "no brew, no leftover codecs — the precondition holds"

      # The question from #22, verbatim: the unit test proves macOsHomebrewAdvice
      # maps its literals correctly; only a genuinely codec-less Mac proves
      # those are the strings dyld actually emits. So this step captures the
      # raw dyld text and confronts each literal with it, one by one. The
      # output sentence is not what is being verified here.
      - name: Confront the six literals with what dyld really says
        run: |
          # A JVM and two jars, nothing else. java comes from the tool cache,
          # not from /usr/local, so the uninstall left it alone.
          JAR=$(ls target/legerix-*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          JNA=/tmp/jna.jar
          echo "jar: $JAR"
          echo "jna: $JNA"
          rm -rf ~/.cache/legerix/"$LEGERIX_VERSION"

          # Written here rather than taken from scripts/ so this workflow needs
          # no change to the tree. The six literals are copied from
          # macOsHomebrewAdvice by hand, on purpose: reading them back from the
          # class would make this green whatever they say.
          mkdir -p /tmp/probe && cat > /tmp/probe/DyldLiteralsProbe.java <<'JAVA'
          import io.github.julienmerconsulting.legerix.Legerix;

          public class DyldLiteralsProbe {
              // macOsHomebrewAdvice fires only if one PATH and one ERROR literal both match.
              static final String[] PATHS  = { "/opt/homebrew/", "/usr/local/opt/", "/usr/local/lib/" };
              static final String[] ERRORS = { "Library not loaded", "image not found", "no such file" };

              public static void main(String[] args) {
                  try {
                      Legerix.loadNatives();
                  } catch (Throwable t) {
                      // When the advice fires, Legerix wraps the original error and keeps
                      // it as the cause. When it does not, the original is rethrown as is.
                      // Either way the raw dyld text is the innermost message.
                      Throwable inner = t;
                      while (inner.getCause() != null) inner = inner.getCause();
                      String raw = String.valueOf(inner.getMessage());
                      boolean adviceFired = inner != t;

                      System.out.println("=== raw dyld text, verbatim ===");
                      System.out.println(raw);
                      System.out.println("=== end ===");
                      System.out.println();
                      System.out.println("literal by literal:");
                      boolean pathHit = false, errHit = false;
                      for (String p : PATHS)  { boolean h = raw.contains(p); pathHit |= h; System.out.printf("  path  %-22s %s%n", "\"" + p + "\"", h ? "PRESENT" : "absent"); }
                      for (String e : ERRORS) { boolean h = raw.contains(e); errHit  |= h; System.out.printf("  error %-22s %s%n", "\"" + e + "\"", h ? "PRESENT" : "absent"); }
                      System.out.println();

                      if (adviceFired) {
                          System.out.println("advice FIRED: a path literal and an error literal both matched the real text.");
                          System.out.println("what the user sees:");
                          System.out.println(t.getMessage());
                          return;
                      }
                      System.out.println("advice did NOT fire: the user gets the raw dyld text with no instruction.");
                      if (!pathHit) System.out.println("  none of the three path literals is in what dyld said");
                      if (!errHit)  System.out.println("  none of the three error literals is in what dyld said");
                      System.out.println("  => the unit test is green on fiction; the literals in Legerix.java need the text above");
                      System.exit(1);
                  }
                  System.out.println("NOT EXERCISED: the natives loaded on a Mac with no Homebrew; "
                          + "the codecs came from somewhere else and the precondition check missed it");
                  System.exit(3);
              }
          }
          JAVA
          java -cp "$JAR:$JNA" /tmp/probe/DyldLiteralsProbe.java
