name: Build and release
run-name: Build and release · ${{ github.ref_name }}
# 7-job matrix: linux x64 modern + legacy, linux aarch64 modern + legacy,
# macOS x64, macOS aarch64, Windows x64. Final job assembles the fat jar
# and attaches the jar + every native to a GitHub Release on tagged builds.
# Maven Central publication is intentionally NOT wired here; use the
# manual "Publish to Maven Central" workflow when the time comes.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ----- Linux x86_64 modern (Ubuntu 24.04, glibc >= 2.38) ------------------
  build_linux_x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "POM_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          # The codecs are built from source and linked statically by the
          # script below; the host only provides the toolchain.
          sudo apt-get install -q -y \
            build-essential cmake nasm autoconf automake libtool pkg-config \
            curl patchelf

      - name: Build self-contained (static codecs)
        run: |
          # Two files per tier, no codec in DT_NEEDED: the same build as the
          # legacy tiers, so nothing has to be copied from the host and nothing
          # is left for the loader to find on the user's machine.
          bash ./scripts/build-self-contained-local.sh
          TIER="linux-$(uname -m | sed 's/x86_64/x86-64/')"
          mkdir -p out
          cp -L "src/main/resources/META-INF/legerix/natives/$TIER/libleptonica.so.6" out/
          cp -L "src/main/resources/META-INF/legerix/natives/$TIER/libtesseract.so.5" out/
          echo "=== NEEDED of libtesseract.so.5 (no codec expected) ==="
          readelf -d out/libtesseract.so.5 | grep NEEDED || true
          if readelf -d out/libtesseract.so.5 out/libleptonica.so.6 | grep -qE "NEEDED.*(libjpeg|libpng|libtiff|libwebp|libzstd|liblzma|libdeflate)"; then
            echo "ERROR: static link failed — a codec is still in DT_NEEDED"
            exit 1
          fi
          echo "OK: $TIER natives are self-contained (no codec DT_NEEDED)"
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86-64
          path: out/

  # ----- Linux x86_64 legacy (manylinux_2_28 container, glibc <= 2.28) ------
  build_linux_x64_legacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build self-contained (static codecs) in manylinux_2_28 (x86_64)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/io -w /io \
            -e TESSERACT_VERSION=${{ env.TESSERACT_VERSION }} \
            -e LEPTONICA_VERSION=${{ env.LEPTONICA_VERSION }} \
            quay.io/pypa/manylinux_2_28_x86_64 \
            /bin/bash -ec '
              # The legacy tier (Ubuntu 22 / glibc 2.35, no system libjpeg.so.62)
              # is the only one affected by #350. Build it STATICALLY here:
              # build-self-contained-local.sh statically links every codec
              # (jpeg/png/tiff/webp/zstd/lzma/deflate/zlib) INTO libleptonica.so.6
              # and libtesseract.so.5, so the resulting .so have NO DT_NEEDED on
              # libjpeg etc. -> they load on any host, no bundling/RPATH tricks.
              yum install -y -q \
                cmake nasm autoconf automake libtool pkgconfig \
                curl tar gzip make gcc gcc-c++
              bash ./scripts/build-self-contained-local.sh
              mkdir -p out
              cp -L src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy/libleptonica.so.6 out/
              cp -L src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy/libtesseract.so.5 out/
              # Guardrail: the .so MUST NOT carry any codec lib in DT_NEEDED.
              echo "=== NEEDED of libtesseract.so.5 (no codec expected) ==="
              readelf -d out/libtesseract.so.5 | grep NEEDED || true
              if readelf -d out/libtesseract.so.5 out/libleptonica.so.6 | grep -qE "NEEDED.*(libjpeg|libpng|libtiff|libwebp|libzstd|liblzma|libdeflate)"; then
                echo "ERROR: static link failed — a codec is still in DT_NEEDED (#350 would reproduce)"
                exit 1
              fi
              echo "OK: legacy x86-64 natives are self-contained (no codec DT_NEEDED)"
              ls -la out/
            '

      - name: Verify GLIBC compatibility (must be <= 2.28)
        run: |
          for SO in out/*.so.*; do
            ALL=$(objdump -T "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)
            MAX=$(printf "%s" "$ALL" | tail -1)
            echo "=== $SO max GLIBC: $MAX ==="
            HIGHEST=$(printf "%s\nGLIBC_2.28\n" "$MAX" | sort -V | tail -1)
            if [ "$HIGHEST" != "GLIBC_2.28" ]; then
              echo "ERROR: $SO requires $MAX > GLIBC_2.28"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86-64-legacy
          path: out/

  # ----- Linux aarch64 modern (Ubuntu 24.04 ARM) ----------------------------
  build_linux_aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          # The codecs are built from source and linked statically by the
          # script below; the host only provides the toolchain.
          sudo apt-get install -q -y \
            build-essential cmake nasm autoconf automake libtool pkg-config \
            curl patchelf

      - name: Build self-contained (static codecs)
        run: |
          # Two files per tier, no codec in DT_NEEDED: the same build as the
          # legacy tiers, so nothing has to be copied from the host and nothing
          # is left for the loader to find on the user's machine.
          bash ./scripts/build-self-contained-local.sh
          TIER="linux-$(uname -m | sed 's/x86_64/x86-64/')"
          mkdir -p out
          cp -L "src/main/resources/META-INF/legerix/natives/$TIER/libleptonica.so.6" out/
          cp -L "src/main/resources/META-INF/legerix/natives/$TIER/libtesseract.so.5" out/
          echo "=== NEEDED of libtesseract.so.5 (no codec expected) ==="
          readelf -d out/libtesseract.so.5 | grep NEEDED || true
          if readelf -d out/libtesseract.so.5 out/libleptonica.so.6 | grep -qE "NEEDED.*(libjpeg|libpng|libtiff|libwebp|libzstd|liblzma|libdeflate)"; then
            echo "ERROR: static link failed — a codec is still in DT_NEEDED"
            exit 1
          fi
          echo "OK: $TIER natives are self-contained (no codec DT_NEEDED)"
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64
          path: out/

  # ----- Linux aarch64 legacy (manylinux_2_28 container) --------------------
  build_linux_aarch64_legacy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build self-contained (static codecs) in manylinux_2_28 (aarch64)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/io -w /io \
            -e TESSERACT_VERSION=${{ env.TESSERACT_VERSION }} \
            -e LEPTONICA_VERSION=${{ env.LEPTONICA_VERSION }} \
            quay.io/pypa/manylinux_2_28_aarch64 \
            /bin/bash -ec '
              # Same static build as the x86-64 legacy tier: every codec is
              # linked into the two .so, nothing is copied from the container.
              yum install -y -q \
                cmake autoconf automake libtool pkgconfig \
                curl tar gzip make gcc gcc-c++
              bash ./scripts/build-self-contained-local.sh
              mkdir -p out
              cp -L src/main/resources/META-INF/legerix/natives/linux-aarch64-legacy/libleptonica.so.6 out/
              cp -L src/main/resources/META-INF/legerix/natives/linux-aarch64-legacy/libtesseract.so.5 out/
              echo "=== NEEDED of libtesseract.so.5 (no codec expected) ==="
              readelf -d out/libtesseract.so.5 | grep NEEDED || true
              if readelf -d out/libtesseract.so.5 out/libleptonica.so.6 | grep -qE "NEEDED.*(libjpeg|libpng|libtiff|libwebp|libzstd|liblzma|libdeflate)"; then
                echo "ERROR: static link failed — a codec is still in DT_NEEDED"
                exit 1
              fi
              echo "OK: legacy aarch64 natives are self-contained (no codec DT_NEEDED)"
              ls -la out/
            '

      - name: Verify GLIBC compatibility (must be <= 2.28)
        run: |
          for SO in out/*.so.*; do
            ALL=$(objdump -T "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)
            MAX=$(printf "%s" "$ALL" | tail -1)
            echo "=== $SO max GLIBC: $MAX ==="
            HIGHEST=$(printf "%s\nGLIBC_2.28\n" "$MAX" | sort -V | tail -1)
            if [ "$HIGHEST" != "GLIBC_2.28" ]; then
              echo "ERROR: $SO requires $MAX > GLIBC_2.28"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64-legacy
          path: out/

  # ----- macOS x86_64 -------------------------------------------------------
  # macos-15-intel, NOT macos-latest: since macos-14 became "latest" the
  # runner is Apple Silicon, and this job compiled arm64 dylibs while
  # labelling them Intel (5.5.0-8 and 5.5.0-9 darwin tiers: Mach-O cputype
  # 0x0100000C on both libtesseract and libleptonica). Proven by
  # probe-macos-intel.yml run 34055801760: same steps on macos-15-intel
  # yield x86_64 for all 16 files. macos-13 is retired; the Intel runners
  # (macos-15-intel, macos-26-intel) stay free until August 2027.
  build_macos_x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          # The darwin tiers link Homebrew's codecs by absolute path and ship
          # none of them: Homebrew is the documented prerequisite (README).
          brew install autoconf automake libtool pkg-config \
                       libpng jpeg libtiff \
                       webp xz zstd jbigkit libdeflate

      - name: Build leptonica + tesseract
        run: |
          PREFIX="$RUNNER_TEMP/legerix-prefix"
          mkdir -p "$PREFIX"
          ./scripts/build-leptonica.sh "$LEPTONICA_VERSION" "$PREFIX"
          ./scripts/build-tesseract.sh "$TESSERACT_VERSION" "$PREFIX"
          mkdir -p out
          cp -L "$PREFIX/lib/libleptonica.6.dylib" out/
          cp -L "$PREFIX/lib/libtesseract.5.dylib" out/

      - name: Rewrite install names + codesign (relocatable dylibs)
        run: |
          # Fresh-built dylibs record the runner's prefix as their install name
          # and as libtesseract's reference to libleptonica; @loader_path makes
          # both relative to the extraction directory. codesign is mandatory
          # after install_name_tool on arm64.
          install_name_tool -id "@loader_path/libleptonica.6.dylib" out/libleptonica.6.dylib
          install_name_tool -id "@loader_path/libtesseract.5.dylib" out/libtesseract.5.dylib
          install_name_tool -change "$RUNNER_TEMP/legerix-prefix/lib/libleptonica.6.dylib" \
                                    "@loader_path/libleptonica.6.dylib" \
                                    out/libtesseract.5.dylib
          codesign -f -s - out/libleptonica.6.dylib
          codesign -f -s - out/libtesseract.5.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: darwin
          path: out/

  # ----- macOS aarch64 (Apple Silicon) --------------------------------------
  build_macos_aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          architecture: aarch64

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          # The darwin tiers link Homebrew's codecs by absolute path and ship
          # none of them: Homebrew is the documented prerequisite (README).
          brew install autoconf automake libtool pkg-config \
                       libpng jpeg libtiff \
                       webp xz zstd jbigkit libdeflate

      - name: Build leptonica + tesseract
        run: |
          PREFIX="$RUNNER_TEMP/legerix-prefix"
          mkdir -p "$PREFIX"
          ./scripts/build-leptonica.sh "$LEPTONICA_VERSION" "$PREFIX"
          ./scripts/build-tesseract.sh "$TESSERACT_VERSION" "$PREFIX"
          mkdir -p out
          cp -L "$PREFIX/lib/libleptonica.6.dylib" out/
          cp -L "$PREFIX/lib/libtesseract.5.dylib" out/

      - name: Rewrite install names + codesign (relocatable dylibs)
        run: |
          # Fresh-built dylibs record the runner's prefix as their install name
          # and as libtesseract's reference to libleptonica; @loader_path makes
          # both relative to the extraction directory. codesign is mandatory
          # after install_name_tool on arm64.
          install_name_tool -id "@loader_path/libleptonica.6.dylib" out/libleptonica.6.dylib
          install_name_tool -id "@loader_path/libtesseract.5.dylib" out/libtesseract.5.dylib
          install_name_tool -change "$RUNNER_TEMP/legerix-prefix/lib/libleptonica.6.dylib" \
                                    "@loader_path/libleptonica.6.dylib" \
                                    out/libtesseract.5.dylib
          codesign -f -s - out/libleptonica.6.dylib
          codesign -f -s - out/libtesseract.5.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-aarch64
          path: out/

  # ----- Windows x86_64 (vcpkg) ---------------------------------------------
  build_windows_x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        shell: bash
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      # vcpkg builds every transitive dep from source (openssl, libcurl,
      # libpng, libjpeg-turbo, libtiff, leptonica, tesseract...) — ~45 min
      # cold. The installed/ + packages/ + buildtrees/ trees can be cached
      # by GitHub Actions, dropping subsequent runs to ~2 min. Cache key
      # depends on tesseract+leptonica versions so a version bump invalidates.
      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/buildtrees
            C:/vcpkg/downloads
          key: vcpkg-windows-tesseract-${{ env.TESSERACT_VERSION }}-leptonica-${{ env.LEPTONICA_VERSION }}
          restore-keys: |
            vcpkg-windows-

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          vcpkg install tesseract:x64-windows leptonica:x64-windows

      - name: Stage native artifacts
        shell: bash
        run: |
          # vcpkg-built tesseract.dll has transitive runtime dependencies
          # on ~10 other DLLs (libpng, libtiff, libjpeg-turbo, libwebp,
          # openjp2, zlib, libcurl, libarchive, etc.). Copy *every* DLL
          # from the vcpkg installed bin/ so the runtime loader can
          # resolve them. Without these, end users hit UnsatisfiedLinkError
          # the first time tesseract.dll tries to load a codec dep.
          mkdir -p out
          VCPKG_BIN="/c/vcpkg/installed/x64-windows/bin"
          cp "$VCPKG_BIN"/*.dll out/
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: win32-x86-64
          path: out/

  # ----- Final job: assemble fat jar (no Maven Central deploy) --------------
  build_dist:
    needs:
      - build_linux_x64
      - build_linux_x64_legacy
      - build_linux_aarch64
      - build_linux_aarch64_legacy
      - build_macos_x64
      - build_macos_aarch64
      - build_windows_x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "POM_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Download all native artifacts
        uses: actions/download-artifact@v8

      - name: Stage natives into src/main/resources
        run: |
          rm -rf src/main/resources/META-INF/legerix/natives/linux-x86-64 \
                 src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy \
                 src/main/resources/META-INF/legerix/natives/linux-aarch64 \
                 src/main/resources/META-INF/legerix/natives/linux-aarch64-legacy \
                 src/main/resources/META-INF/legerix/natives/darwin \
                 src/main/resources/META-INF/legerix/natives/darwin-aarch64 \
                 src/main/resources/META-INF/legerix/natives/win32-x86-64
          mkdir -p src/main/resources/META-INF/legerix/natives/linux-x86-64 \
                   src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy \
                   src/main/resources/META-INF/legerix/natives/linux-aarch64 \
                   src/main/resources/META-INF/legerix/natives/linux-aarch64-legacy \
                   src/main/resources/META-INF/legerix/natives/darwin \
                   src/main/resources/META-INF/legerix/natives/darwin-aarch64 \
                   src/main/resources/META-INF/legerix/natives/win32-x86-64
          cp linux-x86-64/*           src/main/resources/META-INF/legerix/natives/linux-x86-64/
          cp linux-x86-64-legacy/*    src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy/
          cp linux-aarch64/*          src/main/resources/META-INF/legerix/natives/linux-aarch64/
          cp linux-aarch64-legacy/*   src/main/resources/META-INF/legerix/natives/linux-aarch64-legacy/
          cp darwin/*                 src/main/resources/META-INF/legerix/natives/darwin/
          cp darwin-aarch64/*         src/main/resources/META-INF/legerix/natives/darwin-aarch64/
          cp win32-x86-64/*           src/main/resources/META-INF/legerix/natives/win32-x86-64/

      - name: Write per-tier natives manifest (Legerix#21)
        run: bash ./scripts/write-natives-manifest.sh src/main/resources/META-INF/legerix/natives

      - name: Fetch traineddata (5 bundled languages)
        run: bash ./scripts/fetch-traineddata.sh src/main/resources/META-INF/legerix/tessdata

      - name: Verify natives + traineddata
        run: |
          echo "=== Natives staged ==="
          find src/main/resources -type f \( -name "*.so*" -o -name "*.dylib" -o -name "*.dll" \) | sort
          # Each Unix tier ships exactly the two libraries Legerix loads: the
          # codecs are linked statically on Linux and are Homebrew's on macOS.
          # Windows: variable (every vcpkg DLL), so just assert >= 2.
          for TIER in linux-x86-64 linux-x86-64-legacy linux-aarch64 linux-aarch64-legacy darwin darwin-aarch64; do
            COUNT=$(find "src/main/resources/META-INF/legerix/natives/$TIER" -type f \( -name "*.so*" -o -name "*.dylib" \) | wc -l)
            if [ "$COUNT" -ne 2 ]; then
              echo "ERROR: $TIER has $COUNT native(s), expected exactly 2 (leptonica + tesseract)"
              exit 1
            fi
            echo "OK: $TIER has $COUNT natives"
          done
          WIN_COUNT=$(find src/main/resources/META-INF/legerix/natives/win32-x86-64 -type f -name "*.dll" | wc -l)
          if [ "$WIN_COUNT" -lt 2 ]; then
            echo "ERROR: expected at least 2 Windows DLLs (tesseract+leptonica), found $WIN_COUNT"
            exit 1
          fi
          for lang in eng fra spa chi_sim hin; do
            test -f "src/main/resources/META-INF/legerix/tessdata/${lang}.traineddata" \
              || { echo "ERROR: missing tessdata/${lang}.traineddata"; exit 1; }
          done
          echo "OK: all 6 Unix tiers + $WIN_COUNT Windows DLLs + 5 traineddata files"

      - name: Verify NEEDED entries (Linux tiers only)
        run: |
          # Sanity check: every NEEDED entry in Linux .so files must either
          # be a standard glibc/musl lib OR be present in the same tier
          # directory. Catches future regressions where build deps drift
          # and an unexpected lib slips into the binary without being
          # bundled.
          set +e
          STANDARD_LIBS="libc.so libdl.so libm.so libpthread.so librt.so libstdc\\+\\+.so libgcc_s.so ld-linux"
          OVERALL_OK=true
          for TIER_DIR in src/main/resources/META-INF/legerix/natives/linux-*; do
            TIER=$(basename "$TIER_DIR")
            echo "=== $TIER ==="
            for SO in "$TIER_DIR"/*.so*; do
              echo "--- $(basename $SO) ---"
              NEEDED=$(readelf -d "$SO" 2>/dev/null | grep NEEDED | grep -oE '\[[^]]+\]' | tr -d '[]')
              for LIB in $NEEDED; do
                # Check if standard glibc lib
                IS_STD=false
                for STD in $STANDARD_LIBS; do
                  if echo "$LIB" | grep -qE "^${STD}"; then
                    IS_STD=true
                    break
                  fi
                done
                if [ "$IS_STD" = true ]; then
                  echo "  STD     $LIB"
                  continue
                fi
                # Check if present in same tier
                if [ -f "$TIER_DIR/$LIB" ]; then
                  echo "  BUNDLED $LIB"
                else
                  echo "  MISSING $LIB (not standard and not bundled)"
                  OVERALL_OK=false
                fi
              done
            done
          done
          if [ "$OVERALL_OK" != true ]; then
            echo ""
            echo "ERROR: at least one Linux native has an unresolved NEEDED entry."
            echo "Either bundle the missing lib in the corresponding tier, or"
            echo "add it to the STANDARD_LIBS allowlist if it is a true OS-level dep."
            exit 1
          fi
          echo "OK: all Linux NEEDED entries are either standard or bundled."

      - name: Build and test
        run: mvn -B install

      # Legerix#21, on the real path: the tests above run from target/classes,
      # where the manifest is not even read. Take the jar just built, inject a
      # foreign native under the tier the way a co-bundling consumer's fat
      # jar carries one, and load from that copy with an empty cache. The
      # cache must end up holding exactly the manifest. Gate for the release.
      - name: JAR-mode probes (Legerix#21)
        run: bash ./scripts/run-payload-probes.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: target/legerix*

  # ----- GitHub release upload ----------------------------------------------
  # Runs on every workflow trigger (tag push or manual dispatch). The release
  # tag is derived from the pom version (e.g. "v5.5.0-1"). If the release
  # already exists, assets are uploaded with --clobber so re-runs overwrite
  # the previous artifacts in place rather than creating a duplicate release.
  # Same pattern as Apertix.
  release:
    needs: build_dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8

      - name: Prepare release assets
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release-assets

          # Fat jar (contains every platform's natives + tessdata).
          cp dist/legerix-${VERSION}.jar release-assets/

          # Raw natives, one file per platform per lib, suffixed with the
          # platform tag in the basename. Same convention as Apertix.
          # Linux .so
          cp linux-x86-64/libtesseract.so.5         release-assets/libtesseract.so.5-linux-x86-64
          cp linux-x86-64/libleptonica.so.6         release-assets/libleptonica.so.6-linux-x86-64
          cp linux-x86-64-legacy/libtesseract.so.5  release-assets/libtesseract.so.5-linux-x86-64-legacy
          cp linux-x86-64-legacy/libleptonica.so.6  release-assets/libleptonica.so.6-linux-x86-64-legacy
          cp linux-aarch64/libtesseract.so.5        release-assets/libtesseract.so.5-linux-aarch64
          cp linux-aarch64/libleptonica.so.6        release-assets/libleptonica.so.6-linux-aarch64
          cp linux-aarch64-legacy/libtesseract.so.5 release-assets/libtesseract.so.5-linux-aarch64-legacy
          cp linux-aarch64-legacy/libleptonica.so.6 release-assets/libleptonica.so.6-linux-aarch64-legacy
          # macOS .dylib
          cp darwin/libtesseract.5.dylib            release-assets/libtesseract.5-darwin.dylib
          cp darwin/libleptonica.6.dylib            release-assets/libleptonica.6-darwin.dylib
          cp darwin-aarch64/libtesseract.5.dylib    release-assets/libtesseract.5-darwin-aarch64.dylib
          cp darwin-aarch64/libleptonica.6.dylib    release-assets/libleptonica.6-darwin-aarch64.dylib
          # Windows: bundle every DLL (tesseract + leptonica + ~10 transitive
          # codec/runtime deps from vcpkg) as a single zip asset. Individual
          # DLLs are no longer uploaded because end consumers need the full
          # set or none at all (any missing transitive triggers
          # UnsatisfiedLinkError at runtime).
          ( cd win32-x86-64 && zip -r ../release-assets/legerix-win-x86-64.zip . -x ".gitkeep" )

          ls -lh release-assets/

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          # Mark as pre-release for anything that is clearly a test build.
          # Keeps "Latest release" pointing at the last real stable tag on the
          # public releases page, even if a workflow_dispatch from a fix/**
          # branch produces something like v5.5.0-9-DO-NOT-USE first.
          PRERELEASE_FLAG=""
          case "$TAG" in
              *DO-NOT-USE*|*-rc[0-9]*|*-beta*|*-alpha*|*-SNAPSHOT*)
                  PRERELEASE_FLAG="--prerelease"
                  ;;
          esac
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" $PRERELEASE_FLAG \
              --title "Legerix ${{ steps.version.outputs.VERSION }}" \
              --notes "Tesseract + Leptonica natives bundled for Linux (x86_64 + aarch64, modern + legacy glibc 2.28), macOS (x86_64 + aarch64) and Windows (x86_64)."
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          gh release upload "$TAG" release-assets/* --clobber
