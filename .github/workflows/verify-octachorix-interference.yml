name: Octachorix theorem (#20) — fresh natives, Linux modern + legacy + macOS Intel

# Builds Leptonica + Tesseract from source on three runners, exactly as
# build.yml does (the build jobs below are build.yml's, copied verbatim,
# without the release), then runs Octachorix's test suite against the files
# just produced, with a system Tesseract installed NEXT to them: apt on
# Linux, brew on macOS. The library actually bound must be ours, the Tesseract
# version the pom declares, never the neighbour's. Nothing is downloaded from a
# release and nothing is published: this run tests what THIS commit builds, not
# what the last release shipped. It also runs the payload probes of #21 on the
# jar it packages.
#
# No branch allowlist under push, on purpose: a filter naming one branch is how
# a workflow goes quiet the day that branch is merged or renamed, which is the
# defect David Young found on the OculiX side (Oculix#465). Every push is
# checked, whatever the branch.

on:
  workflow_dispatch:
  push:

jobs:
  # ----- Linux x86_64 modern (Ubuntu 24.04, glibc >= 2.38) ------------------
  # build.yml: build_linux_x64
  build_linux_x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y \
            build-essential autoconf automake libtool pkg-config \
            libpng-dev libjpeg-dev libtiff-dev zlib1g-dev \
            libwebp-dev libzstd-dev liblzma-dev liblerc-dev libjbig-dev libdeflate-dev \
            curl patchelf

      - name: Build leptonica + tesseract
        run: |
          PREFIX="$RUNNER_TEMP/legerix-prefix"
          mkdir -p "$PREFIX"
          ./scripts/build-leptonica.sh "$LEPTONICA_VERSION" "$PREFIX"
          ./scripts/build-tesseract.sh "$TESSERACT_VERSION" "$PREFIX"
          mkdir -p out
          cp -L "$PREFIX/lib/libleptonica.so.6" out/
          cp -L "$PREFIX/lib/libtesseract.so.5" out/

      - name: Bundle transitive codec deps (jpeg, png, tiff, zlib)
        run: |
          LIB_DIR="/usr/lib/x86_64-linux-gnu"
          cp -L "$LIB_DIR"/libjpeg.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libpng16.so.*    out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libtiff.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libz.so.*        out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libwebp.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libzstd.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/liblzma.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libLerc.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libjbig.so.*     out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libdeflate.so.*  out/ 2>/dev/null || true
          cp -L "$LIB_DIR"/libsharpyuv.so.* out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-linux-x86-64
          path: out/

  # ----- Linux x86_64 legacy (manylinux_2_28 container, glibc <= 2.28) ------
  # build.yml: build_linux_x64_legacy
  build_linux_x64_legacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build self-contained (static codecs) in manylinux_2_28 (x86_64)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/io -w /io \
            -e TESSERACT_VERSION=${{ env.TESSERACT_VERSION }} \
            -e LEPTONICA_VERSION=${{ env.LEPTONICA_VERSION }} \
            quay.io/pypa/manylinux_2_28_x86_64 \
            /bin/bash -ec '
              yum install -y -q \
                cmake nasm autoconf automake libtool pkgconfig \
                curl tar gzip make gcc gcc-c++
              bash ./scripts/build-self-contained-local.sh
              mkdir -p out
              cp -L src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy/libleptonica.so.6 out/
              cp -L src/main/resources/META-INF/legerix/natives/linux-x86-64-legacy/libtesseract.so.5 out/
              echo "=== NEEDED of libtesseract.so.5 (no codec expected) ==="
              readelf -d out/libtesseract.so.5 | grep NEEDED || true
              if readelf -d out/libtesseract.so.5 out/libleptonica.so.6 | grep -qE "NEEDED.*(libjpeg|libpng|libtiff|libwebp|libzstd|liblzma|libdeflate)"; then
                echo "ERROR: static link failed — a codec is still in DT_NEEDED (#350 would reproduce)"
                exit 1
              fi
              echo "OK: legacy x86-64 natives are self-contained (no codec DT_NEEDED)"
              ls -la out/
            '

      - name: Verify GLIBC compatibility (must be <= 2.28)
        run: |
          for SO in out/*.so.*; do
            ALL=$(objdump -T "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)
            MAX=$(printf "%s" "$ALL" | tail -1)
            echo "=== $SO max GLIBC: $MAX ==="
            HIGHEST=$(printf "%s\nGLIBC_2.28\n" "$MAX" | sort -V | tail -1)
            if [ "$HIGHEST" != "GLIBC_2.28" ]; then
              echo "ERROR: $SO requires $MAX > GLIBC_2.28"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-linux-x86-64-legacy
          path: out/

  # ----- macOS x86_64 (Intel) -----------------------------------------------
  # build.yml: build_macos_x64, on macos-15-intel (the darwin tier is the
  # Intel payload; macos-latest is Apple Silicon since macos-14).
  build_macos_x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Runner architecture (sanity)
        run: |
          uname -m
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "ERROR: expected an Intel runner, got $(uname -m)"
            exit 1
          fi

      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV
          echo "LEPTONICA_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=leptonica.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config \
                       libpng jpeg libtiff \
                       webp xz zstd jbigkit libdeflate

      - name: Build leptonica + tesseract
        run: |
          PREFIX="$RUNNER_TEMP/legerix-prefix"
          mkdir -p "$PREFIX"
          ./scripts/build-leptonica.sh "$LEPTONICA_VERSION" "$PREFIX"
          ./scripts/build-tesseract.sh "$TESSERACT_VERSION" "$PREFIX"
          mkdir -p out
          cp -L "$PREFIX/lib/libleptonica.6.dylib" out/
          cp -L "$PREFIX/lib/libtesseract.5.dylib" out/

      - name: Rewrite install names + codesign (relocatable dylibs)
        run: |
          install_name_tool -id "@loader_path/libleptonica.6.dylib" out/libleptonica.6.dylib
          install_name_tool -id "@loader_path/libtesseract.5.dylib" out/libtesseract.5.dylib
          install_name_tool -change "$RUNNER_TEMP/legerix-prefix/lib/libleptonica.6.dylib" \
                                    "@loader_path/libleptonica.6.dylib" \
                                    out/libtesseract.5.dylib
          codesign -f -s - out/libleptonica.6.dylib
          codesign -f -s - out/libtesseract.5.dylib

      - name: Bundle transitive codec deps from homebrew
        run: |
          BREW_PREFIX="$(brew --prefix)"
          cp -L "$BREW_PREFIX"/lib/libjpeg.*.dylib       out/
          cp -L "$BREW_PREFIX"/lib/libpng16.*.dylib      out/
          cp -L "$BREW_PREFIX"/lib/libtiff.*.dylib       out/
          cp -L "$BREW_PREFIX"/lib/libwebp.*.dylib       out/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/libzstd.*.dylib       out/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/liblzma.*.dylib       out/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/libLerc.*.dylib       out/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/libjbig.*.dylib       out/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/libdeflate.*.dylib    out/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/libsharpyuv.*.dylib   out/ 2>/dev/null || true
          ls -la out/

      - name: Architecture of every produced dylib
        run: |
          for f in out/*.dylib; do
            printf '%-40s %s\n' "$(basename "$f")" "$(lipo -archs "$f")"
            if [ "$(lipo -archs "$f")" != "x86_64" ]; then
              echo "ERROR: $f is not x86_64"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-darwin
          path: out/

  # ----- The theorem, on what the three jobs above just built ---------------
  theorem:
    needs: [build_linux_x64, build_linux_x64_legacy, build_macos_x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: linux-x86-64
            os: ubuntu-24.04
            artifact: fresh-linux-x86-64
            tesseract: libtesseract.so.5
            leptonica: libleptonica.so.6
          - tier: linux-x86-64-legacy
            os: ubuntu-22.04
            artifact: fresh-linux-x86-64-legacy
            tesseract: libtesseract.so.5
            leptonica: libleptonica.so.6
          - tier: darwin
            os: macos-15-intel
            artifact: fresh-darwin
            tesseract: libtesseract.5.dylib
            leptonica: libleptonica.6.dylib

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.tier }} + system tesseract

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: oculix-org/Octachorix
          path: octachorix

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The version the theorem asserts comes from the pom, like the one the
      # build jobs compile. Hardcoding it here would make the next bump either
      # fail this job or, worse, assert a version nothing ships any more.
      - name: Get Version Info
        run: |
          echo "TESSERACT_VERSION=$(mvn build-helper:parse-version org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=tesseract.version.long -q -DforceStdout)" >> $GITHUB_ENV

      - name: Natives built by this run (${{ matrix.artifact }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: natives

      - name: Fetch traineddata (5 bundled languages)
        run: |
          bash ./scripts/fetch-traineddata.sh tessdata
          ls -la natives/ tessdata/

      - name: Install system Tesseract (Linux — apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y tesseract-ocr
          tesseract --version 2>&1 | head -1

      - name: Install system Tesseract (macOS — brew)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          tesseract --version 2>&1 | head -1
          ls -la "$(brew --prefix)"/lib/libtesseract* "$(brew --prefix)"/lib/libleptonica* || true

      - name: mvn test (Octachorix, bound to the fresh natives by absolute path)
        working-directory: octachorix
        run: >
          mvn -B test
          -DargLine="-Doctachorix.test.libs.tesseract=${{ github.workspace }}/natives/${{ matrix.tesseract }}
          -Doctachorix.test.libs.leptonica=${{ github.workspace }}/natives/${{ matrix.leptonica }}
          -Doctachorix.test.libs.tessdata=${{ github.workspace }}/tessdata
          -Doctachorix.test.expectedVersion=${{ env.TESSERACT_VERSION }}"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-${{ matrix.tier }}
          path: |
            octachorix/target/surefire-reports/
            octachorix/hs_err_pid*.log

  # ----- Legerix#21 on the real path, before any tag ---------------------
  # Package a Legerix jar with the fresh linux-x86-64 natives, inject a
  # foreign native under the tier the way a co-bundling consumer's fat jar
  # carries one, and load from that copy with an empty cache: the cache must
  # hold exactly the manifest. mvn test cannot cover this, it runs from
  # target/classes where the manifest is not read. The other tiers get empty
  # placeholder files: the bundle plugin wants them present to write its
  # OSGi header, the probe never touches them.
  jar_mode_probe:
    needs: build_linux_x64
    runs-on: ubuntu-24.04
    name: jar-mode extraction probe (#21)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Stage the fresh linux-x86-64 natives
        uses: actions/download-artifact@v4
        with:
          name: fresh-linux-x86-64
          path: src/main/resources/META-INF/legerix/natives/linux-x86-64

      - name: Placeholders for the tiers the bundle plugin requires, manifest, traineddata
        run: |
          : > src/main/resources/META-INF/legerix/natives/linux-aarch64/libtesseract.so.5
          : > src/main/resources/META-INF/legerix/natives/darwin/libtesseract.5.dylib
          : > src/main/resources/META-INF/legerix/natives/darwin-aarch64/libtesseract.5.dylib
          : > src/main/resources/META-INF/legerix/natives/win32-x86-64/tesseract55.dll
          LEGERIX_TIERS=linux-x86-64 bash ./scripts/write-natives-manifest.sh src/main/resources/META-INF/legerix/natives
          bash ./scripts/fetch-traineddata.sh src/main/resources/META-INF/legerix/tessdata

      - name: Package
        run: mvn -B -q package -DskipTests

      - name: JAR-mode probes (Legerix#21)
        run: bash ./scripts/run-payload-probes.sh

  # ----- macOS without Homebrew codecs: the message, not a dyld dump -------
  # The darwin tiers are linked against Homebrew's image codecs by absolute
  # path (documented prerequisite). On the Intel runner, remove those
  # formulae, package a Legerix jar with the fresh darwin natives, and load:
  # loadNatives() must fail with the "brew install ..." instruction in the
  # UnsatisfiedLinkError. If it loads anyway the probe exits 3: the codecs
  # were still reachable, so the message path was not exercised, and the job
  # says so instead of passing on nothing.
  mac_no_homebrew_probe:
    needs: build_macos_x64
    runs-on: macos-15-intel
    name: macOS without Homebrew codecs (message probe)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Stage the fresh darwin natives
        uses: actions/download-artifact@v4
        with:
          name: fresh-darwin
          path: src/main/resources/META-INF/legerix/natives/darwin

      - name: Placeholders for the other tiers, manifest, traineddata
        run: |
          : > src/main/resources/META-INF/legerix/natives/linux-x86-64/libtesseract.so.5
          : > src/main/resources/META-INF/legerix/natives/linux-aarch64/libtesseract.so.5
          : > src/main/resources/META-INF/legerix/natives/darwin-aarch64/libtesseract.5.dylib
          : > src/main/resources/META-INF/legerix/natives/win32-x86-64/tesseract55.dll
          LEGERIX_TIERS=darwin bash ./scripts/write-natives-manifest.sh src/main/resources/META-INF/legerix/natives
          bash ./scripts/fetch-traineddata.sh src/main/resources/META-INF/legerix/tessdata

      - name: Package
        run: mvn -B -q package -DskipTests

      - name: Remove the Homebrew codecs the darwin natives reference
        run: |
          otool -L src/main/resources/META-INF/legerix/natives/darwin/libleptonica.6.dylib
          brew uninstall --ignore-dependencies --force jpeg-turbo libpng libtiff webp zstd xz libdeflate || true
          ls /usr/local/opt/jpeg-turbo/lib 2>&1 || echo "jpeg-turbo gone, as intended"

      - name: Load from the jar and expect the instruction
        run: |
          JAR=$(ls target/legerix-*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          JNA=$(mvn -B -q dependency:build-classpath -DincludeArtifactIds=jna -Dmdep.outputFile=/dev/stdout)
          rm -rf ~/.cache/legerix/$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          java -cp "$JAR:$JNA" scripts/MacNoHomebrewProbe.java
