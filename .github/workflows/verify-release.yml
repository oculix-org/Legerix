name: Verify Release (dry-run)
# Same payload staging as publish-maven-central.yml but stops at `mvn verify`.
# Validates that compile + bundle + sources + javadoc + GPG signing all pass
# without actually deploying to Maven Central. Safe to run as many times as
# needed before the real publish.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve release tag from pom version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "POM_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Download natives from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          # One zip per tier (legerix-<tier>.zip): leptonica + tesseract +
          # bundled codec deps (libjpeg, libpng, libtiff, libz, ...).
          gh release download "$RELEASE_TAG" --dir assets --pattern 'legerix-*.zip'
          ls -la assets/

      - name: Stage natives into src/main/resources
        run: |
          # Each legerix-<tier>.zip carries that tier's full native payload
          # (leptonica + tesseract + bundled codecs). Unzip each into its
          # resource dir — identical to publish-maven-central.yml.
          for TIER in linux-x86-64 linux-x86-64-legacy linux-aarch64 linux-aarch64-legacy darwin darwin-aarch64 win32-x86-64; do
            mkdir -p "src/main/resources/$TIER"
            unzip -o "assets/legerix-${TIER}.zip" -d "src/main/resources/$TIER/"
          done

      - name: Fetch traineddata (5 bundled languages)
        run: bash ./scripts/fetch-traineddata.sh src/main/resources/tessdata

      - name: Verify staged payload
        run: |
          echo "=== Natives staged ==="
          find src/main/resources -type f \( -name "*.so*" -o -name "*.dylib" -o -name "*.dll" \) | sort
          # With bundled codecs each Unix tier now has >= 2 files (not a fixed 12).
          for TIER in linux-x86-64 linux-x86-64-legacy linux-aarch64 linux-aarch64-legacy darwin darwin-aarch64; do
            COUNT=$(find "src/main/resources/$TIER" -type f \( -name "*.so*" -o -name "*.dylib" \) | wc -l)
            if [ "$COUNT" -lt 2 ]; then
              echo "ERROR: $TIER has only $COUNT native(s), expected >= 2 (leptonica + tesseract)"
              exit 1
            fi
          done
          # #350 guard: libjpeg MUST be bundled in every Linux tier.
          for TIER in linux-x86-64 linux-x86-64-legacy linux-aarch64 linux-aarch64-legacy; do
            ls src/main/resources/$TIER/libjpeg.so.* >/dev/null 2>&1 \
              || { echo "ERROR: $TIER is missing bundled libjpeg (issue #350 regression)"; exit 1; }
          done
          WIN_COUNT=$(find src/main/resources/win32-x86-64 -type f -name "*.dll" | wc -l)
          if [ "$WIN_COUNT" -lt 2 ]; then
            echo "ERROR: expected at least 2 Windows DLLs, found $WIN_COUNT"
            exit 1
          fi
          for lang in eng fra spa chi_sim hin; do
            test -f "src/main/resources/tessdata/${lang}.traineddata" \
              || { echo "ERROR: missing tessdata/${lang}.traineddata"; exit 1; }
          done
          echo "OK: all Unix tiers carry leptonica+tesseract+libjpeg, $WIN_COUNT Windows DLLs, 5 traineddata files"

      - name: Maven verify (compile + bundle + sources + javadoc + GPG sign)
        run: mvn -B verify -P release -DskipTests
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Inspect produced JAR
        run: |
          JAR=$(ls target/legerix-*.jar | grep -v sources | grep -v javadoc | head -1)
          echo "=== Inspecting $JAR ==="
          ls -la target/legerix-*.jar target/legerix-*.jar.asc 2>/dev/null || true
          echo "=== Natives + tessdata inside the jar ==="
          unzip -l "$JAR" | grep -E '\.(so|dll|dylib|traineddata)' | sort
          WIN_PAYLOAD=$(unzip -l "$JAR" | grep -E '(^|[[:space:]])win32-x86-64/[^/]+\.dll$' | wc -l)
          TRAINED_PAYLOAD=$(unzip -l "$JAR" | grep -E '(^|[[:space:]])tessdata/[^/]+\.traineddata$' | wc -l)
          echo "Windows DLLs: $WIN_PAYLOAD, traineddata: $TRAINED_PAYLOAD"
          if [ "$WIN_PAYLOAD" -lt 2 ] || [ "$TRAINED_PAYLOAD" -ne 5 ]; then
            echo "ERROR: jar payload mismatch (windows / tessdata)"
            exit 1
          fi
          # === THE #350 proof ===
          # libjpeg MUST be present inside the produced jar for every Linux
          # tier. This is the direct evidence — on the actual artifact, before
          # any deploy — that the Maven Central jar will load on Ubuntu 22.
          for TIER in linux-x86-64 linux-x86-64-legacy linux-aarch64 linux-aarch64-legacy; do
            unzip -l "$JAR" | grep -qE "${TIER}/libjpeg\.so\." \
              || { echo "ERROR: jar is MISSING ${TIER}/libjpeg.so.* (issue #350 would reproduce)"; exit 1; }
            echo "OK: jar carries ${TIER}/libjpeg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legerix-verify-output
          path: |
            target/legerix-*.jar
            target/legerix-*.jar.asc
            target/legerix-*.pom
            target/legerix-*.pom.asc
          if-no-files-found: error
